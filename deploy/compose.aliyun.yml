services:
  postgres:
    image: postgres:15-bookworm
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: reverse_analyzer
      POSTGRES_USER: reverse_analyzer
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverse_analyzer -d reverse_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.50
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${REVERSE_ANALYZER_IMAGE:?set REVERSE_ANALYZER_IMAGE}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVERSE_ANALYZER_ENV: production
      REVERSE_ANALYZER_WORKSPACE: /workspace
      REVERSE_ANALYZER_FRONTEND_DIR: /app/frontend/dist
      REVERSE_ANALYZER_WEB_ADDR: 0.0.0.0:8090
      REVERSE_ANALYZER_WEB_TOKEN_FILE: /run/secrets/web_token
      REVERSE_ANALYZER_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REVERSE_ANALYZER_POSTGRES_HOST: postgres
      REVERSE_ANALYZER_POSTGRES_PORT: "5432"
      REVERSE_ANALYZER_POSTGRES_DB: reverse_analyzer
      REVERSE_ANALYZER_POSTGRES_USER: reverse_analyzer
      REVERSE_ANALYZER_PUBLIC_URL: https://pe.toporeduce.cn
      REVERSE_ANALYZER_CORS_ALLOWED_ORIGINS: https://pe.toporeduce.cn
      REVERSE_ANALYZER_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      REVERSE_ANALYZER_PROVIDER_CONFIG: /run/config/provider.local.json
      REVERSE_ANALYZER_RUNNER_URL: http://runner:8091
      REVERSE_ANALYZER_RUNNER_TOKEN_FILE: /run/secrets/runner_token
      REVERSE_ANALYZER_PROVIDER_TIMEOUT: "600"
      REVERSE_ANALYZER_PROVIDER_MAX_OUTPUT_TOKENS: "4096"
      REVERSE_ANALYZER_PROVIDER_REQUEST_LIMIT: "64"
      REVERSE_ANALYZER_PROVIDER_TOKEN_BUDGET: "131072"
    secrets:
      - postgres_password
      - web_token
      - runner_token
    volumes:
      - workspace:/workspace
      - /opt/pe-reverse-analyzer/config/provider.local.json:/run/config/provider.local.json:ro
    tmpfs:
      - /tmp:size=192m,mode=1777
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 768m
    cpus: 1.25
    pids_limit: 384
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  runner:
    image: ${REVERSE_ANALYZER_RUNNER_IMAGE:?set REVERSE_ANALYZER_RUNNER_IMAGE}
    pull_policy: never
    restart: unless-stopped
    user: "65532:65532"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID}"
    environment:
      REVERSE_ANALYZER_RUNNER_ADDR: 0.0.0.0:8091
      REVERSE_ANALYZER_RUNNER_TOKEN_FILE: /run/secrets/runner_token
      REVERSE_ANALYZER_RUNNER_RUNTIME: docker
      REVERSE_ANALYZER_RUNNER_WORKER_IMAGE: ${REVERSE_ANALYZER_IMAGE}
      REVERSE_ANALYZER_RUNNER_WORKSPACE_VOLUME: pe_reverse_analyzer_workspace
    secrets:
      - runner_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"X-Runner-Token: $$(cat /run/secrets/runner_token)\" http://127.0.0.1:8091/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 8
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres_data:
    name: pe_reverse_analyzer_postgres
  workspace:
    name: pe_reverse_analyzer_workspace

secrets:
  postgres_password:
    file: /opt/pe-reverse-analyzer/secrets/postgres_password
  web_token:
    file: /opt/pe-reverse-analyzer/secrets/web_token
  runner_token:
    file: /opt/pe-reverse-analyzer/secrets/runner_token
