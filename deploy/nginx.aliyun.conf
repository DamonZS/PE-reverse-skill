server {
    listen 80;
    listen [::]:80;
    server_name pe.toporeduce.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pe.toporeduce.cn;

    ssl_certificate /etc/nginx/ssl/pe.toporeduce.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/pe.toporeduce.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pe_reverse_analyzer:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /codegraph/rpc {
        include /etc/nginx/snippets/codegraph-auth.conf;
        proxy_pass http://127.0.0.1:9749/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
