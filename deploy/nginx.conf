# Reverse Analyzer Web console reverse proxy template.
# This file intentionally omits TLS certificates and authentication secrets.
# Terminate TLS and enforce identity at the edge before proxying to the local service.

server {
    listen 443 ssl http2;
    server_name reverse-analyzer.example.internal;

    # ssl_certificate     /etc/nginx/tls/fullchain.pem;
    # ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # auth_basic           "Reverse Analyzer";
    # auth_basic_user_file /etc/nginx/auth/reverse-analyzer.htpasswd;

    client_max_body_size 64m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Prefer injecting the application token from a secret manager instead of
        # asking browsers to send it directly when SSO/auth_request is available.
        # proxy_set_header Authorization "Bearer ${REVERSE_ANALYZER_WEB_TOKEN}";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
