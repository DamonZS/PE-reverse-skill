name: reverse-jailbreak release

on:
  push:
    paths:
      - "reverse_analyzer/**"
      - "config/jailbreak-campaign.example.json"
      - "schemas/jailbreak-campaign.schema.json"
      - "scripts/build_reverse_jailbreak.ps1"
      - "scripts/build_reverse_jailbreak.sh"
      - "scripts/smoke_reverse_jailbreak_release.py"
      - "reverse_analyzer/llm_jailbreak/release.py"
      - "docs/reverse_jailbreak_release.md"
      - "docs/releases/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/reverse-jailbreak-release.yml"
  pull_request:
    paths:
      - "reverse_analyzer/**"
      - "config/jailbreak-campaign.example.json"
      - "schemas/jailbreak-campaign.schema.json"
      - "scripts/build_reverse_jailbreak.ps1"
      - "scripts/build_reverse_jailbreak.sh"
      - "scripts/smoke_reverse_jailbreak_release.py"
      - "reverse_analyzer/llm_jailbreak/release.py"
      - "docs/reverse_jailbreak_release.md"
      - "docs/releases/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/reverse-jailbreak-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
            publish: false
          - os: windows-latest
            python: "3.12"
            publish: true
          - os: ubuntu-latest
            python: "3.13"
            publish: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Run release tests
        run: python -m unittest tests.test_llm_jailbreak_release
      - name: Run offline benchmark regression
        run: python -m unittest tests.test_llm_jailbreak_benchmark tests.test_llm_jailbreak_dashboard
      - name: Build and verify portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_reverse_jailbreak.ps1 -Output artifact/reverse-jailbreak -Clean
      - name: Build and verify portable package (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build_reverse_jailbreak.sh --output artifact/reverse-jailbreak --clean
      - name: Smoke installed console entry point
        run: python artifact/reverse-jailbreak/smoke_release.py artifact/reverse-jailbreak
      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: reverse-jailbreak-${{ github.sha }}
          path: artifact/reverse-jailbreak
          if-no-files-found: error
