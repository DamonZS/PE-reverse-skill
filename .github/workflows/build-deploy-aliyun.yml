name: 构建并部署阿里云

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aliyun-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python 回归
        run: python scripts/run_python_regression.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go 回归
        run: go test ./... -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端测试与构建
        run: npm ci --prefix frontend && npm test --prefix frontend && npm run build --prefix frontend

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建生产镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: reverse-analyzer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 构建 Runner 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          load: true
          tags: reverse-analyzer-runner:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - name: 验证 Android 真实构建工具链
        run: |
          docker run --rm --entrypoint sh reverse-analyzer:${{ github.sha }} -lc \
            'java -version && apktool --version && jadx --version'
      - name: 打包镜像
        run: |
          docker pull postgres:15-bookworm
          docker save reverse-analyzer:${{ github.sha }} reverse-analyzer-runner:${{ github.sha }} postgres:15-bookworm | gzip -1 > reverse-analyzer-image.tar.gz
          git archive --format=tar.gz -o source.tar.gz HEAD
          curl -fsSL --retry 5 --retry-all-errors \
            https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.9.0/codebase-memory-mcp-ui-linux-amd64-portable.tar.gz \
            -o codebase-memory-mcp-ui-linux-amd64-portable.tar.gz
          curl -fsSL --retry 5 --retry-all-errors \
            https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.9.0/checksums.txt \
            -o codegraph-checksums.txt
          grep '  codebase-memory-mcp-ui-linux-amd64-portable.tar.gz$' codegraph-checksums.txt | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-analyzer-${{ github.sha }}
          path: reverse-analyzer-image.tar.gz
          retention-days: 7
      - name: 清理远端发布空间
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          command_timeout: 10m
          script: |
            set -eu
            ROOT=/opt/pe-reverse-analyzer
            mkdir -p "$ROOT/releases"
            echo "上传前清理历史发布与无引用 Docker 数据"
            find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -nr \
              | awk 'NR > 1 {sub(/^[^ ]+ /, ""); print}' \
              | while IFS= read -r stale_release; do
                  test -n "$stale_release" && rm -rf -- "$stale_release"
                done
            docker container prune -f
            docker builder prune -af
            docker image prune -af
            df -h "$ROOT" /var/lib/docker 2>/dev/null || df -h "$ROOT"
            docker system df || true
      - name: 上传发布文件
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          source: "reverse-analyzer-image.tar.gz,source.tar.gz,codebase-memory-mcp-ui-linux-amd64-portable.tar.gz,codegraph-checksums.txt,deploy/compose.aliyun.yml,deploy/nginx.aliyun.conf,deploy/install-codegraph.sh,deploy/codebase-memory.service"
          target: "/opt/pe-reverse-analyzer/releases/${{ github.sha }}"

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 原子更新并健康检查
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          command_timeout: 20m
          script: |
            set -eu
            ROOT=/opt/pe-reverse-analyzer
            RELEASE="$ROOT/releases/${{ github.sha }}"
            ARCHIVE="$RELEASE/reverse-analyzer-image.tar.gz"
            test -s "$ARCHIVE"

            echo "部署前磁盘与 Docker 占用"
            df -h "$ROOT" /var/lib/docker 2>/dev/null || df -h "$ROOT"
            docker system df || true

            # 保留当前发布和最近一个旧发布，清理更早的完整镜像归档。
            find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d ! -path "$RELEASE" -printf '%T@ %p\n' \
              | sort -nr \
              | awk 'NR > 1 {sub(/^[^ ]+ /, ""); print}' \
              | while IFS= read -r stale_release; do
                  test -n "$stale_release" && rm -rf -- "$stale_release"
                done

            # prune -a 只删除无容器引用的镜像，不影响当前运行服务及持久卷。
            docker container prune -f
            docker builder prune -af
            docker image prune -af

            docker_root=$(docker info --format '{{.DockerRootDir}}')
            archive_bytes=$(stat -c %s "$ARCHIVE")
            available_kb=$(df -Pk "$docker_root" | awk 'NR == 2 {print $4}')
            required_kb=$((archive_bytes / 1024 * 4 + 1048576))
            if [ "$available_kb" -lt "$required_kb" ]; then
              echo "Docker 数据盘空间不足：可用 ${available_kb} KiB，至少需要 ${required_kb} KiB" >&2
              exit 1
            fi

            gzip -dc "$ARCHIVE" | docker load
            cp "$RELEASE/deploy/compose.aliyun.yml" "$ROOT/compose.yml"
            cp "$RELEASE/deploy/nginx.aliyun.conf" "$ROOT/nginx.conf"
            sh "$RELEASE/deploy/install-codegraph.sh" "$RELEASE"
            if [ ! -s "$ROOT/secrets/runner_token" ]; then
              umask 077
              openssl rand -hex 32 > "$ROOT/secrets/runner_token"
            fi
            chown root:10001 "$ROOT/secrets/postgres_password" "$ROOT/secrets/web_token" "$ROOT/secrets/runner_token" "$ROOT/config/provider.local.json"
            chmod 0640 "$ROOT/secrets/postgres_password" "$ROOT/secrets/web_token" "$ROOT/secrets/runner_token"
            chmod 0660 "$ROOT/config/provider.local.json"
            . "$ROOT/deploy.env"
            export REVERSE_ANALYZER_IMAGE="reverse-analyzer:${{ github.sha }}"
            export REVERSE_ANALYZER_RUNNER_IMAGE="reverse-analyzer-runner:${{ github.sha }}"
            docker compose --project-name pe-reverse-analyzer --env-file "$ROOT/deploy.env" -f "$ROOT/compose.yml" up -d --remove-orphans
            docker image prune -af
            docker builder prune -af
            for i in $(seq 1 60); do
              curl -fsS http://127.0.0.1:8090/readyz >/dev/null && break
              test "$i" -lt 60
              sleep 2
            done
            install -o root -g root -m 0644 "$ROOT/nginx.conf" /etc/nginx/conf.d/pe.toporeduce.cn.conf
            nginx -t
            systemctl reload nginx
            curl -fsS https://pe.toporeduce.cn/readyz >/dev/null
